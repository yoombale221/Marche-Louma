function setCat(c,el){catFilter=c;document.querySelectorAll('.cat').forEach(b=>b.className='cat bg-white border px-4 py-2 rounded-full font-bold');el.className='cat bg-[#0f172a] text-white px-4 py-2 rounded-full font-bold';render();}
