<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché Louma 🇸🇳 - Vends tout au Sénégal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#f5f7fb}
header{background:#0b2e6e;color:white;padding:14px 12px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:26px;font-weight:900}
header p{font-size:13px;opacity:.9;margin-top:2px}
.search-bar{display:flex;gap:8px;padding:12px;background:white;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search-bar input{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid #ddd;font-size:14px}
.btn-vendre{background:#ff7a00;color:white;border:none;padding:0 20px;border-radius:12px;font-weight:800;font-size:15px}
.filters{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap;background:white}
.filters button{border:1.5px solid #0b2e6e;background:white;color:#0b2e6e;padding:8px 14px;border-radius:20px;font-weight:700;font-size:13px}
.filters button.active{background:#0b2e6e;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card img{width:100%;height:160px;object-fit:cover}
.badge{position:absolute;background:#0b2e6e;color:white;font-size:11px;padding:4px 8px;border-radius:12px;margin:8px;font-weight:700}
.img-wrap{position:relative}
.card-body{padding:10px}
.card-title{font-size:14px;font-weight:800;line-height:1.2;height:34px;overflow:hidden}
.card-price{color:#0b2e6e;font-weight:900;margin:6px 0;font-size:15px}
.card-meta{font-size:11px;color:gray}
.btn-contact{width:100%;margin-top:8px;background:#22c55e;color:white;border:none;padding:10px;border-radius:10px;font-weight:800;font-size:13px}
</style>
</head>
<body>
<header>
<h1>Marché Louma 🇸🇳</h1>
<p>Marché Général • Sénégal - Vends tout ce que tu n'utilises plus</p>
</header>
<div class="search-bar">
<input id="search" placeholder="Rechercher: voiture, iPhone, canapé..." oninput="filtrer()">
<button class="btn-vendre" onclick="vendre()">+ Vendre</button>
</div>
<div class="filters">
<button class="active" onclick="filterCat('Tout',this)">Tout</button>
<button onclick="filterCat('Vehicules',this)">🚗 Véhicules</button>
<button onclick="filterCat('Telephones',this)">📱 Tél</button>
<button onclick="filterCat('Electro',this)">💻 Électro</button>
<button onclick="filterCat('Maison',this)">🛋️ Maison</button>
</div>
<div class="grid" id="grid"></div>
<script>
const WHATSAPP = "221784417720";
const produits = [
{titre:"Toyota Corolla 2015",prix:"3 500 000 FCFA",cat:"Vehicules",ville:"Dakar",etat:"Très bon état",img:"https://images.unsplash.com/photo-1550355291-bbee04a92027?w=600"},
{titre:"iPhone 13 Pro 128Go",prix:"280 000 FCFA",cat:"Telephones",ville:"Dakar",etat:"Très bon état",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600"},
{titre:"Canapé 3 Places Velours",prix:"150 000 FCFA",cat:"Maison",ville:"Guédiawaye",etat:"Bon état",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600"},
{titre:"Moto Jakarta 125",prix:"450 000 FCFA",cat:"Vehicules",ville:"Thiès",etat:"Bon état",img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600"},
];
let catActive="Tout";
function render(list){
 document.getElementById('grid').innerHTML = list.map(p=>`
  <div class="card">
   <div class="img-wrap"><span class="badge">${p.etat}</span><img src="${p.img}"></div>
   <div class="card-body">
    <div class="card-title">${p.titre}</div>
    <div class="card-price">${p.prix}</div>
    <div class="card-meta">${p.cat} • ${p.ville}</div>
    <button class="btn-contact" onclick="contacter('${p.titre} à ${p.prix}')">Contacter 🟢</button>
   </div>
  </div>
 `).join('');
}
function contacter(article){
 const msg = encodeURIComponent(`Salut, je suis intéressé par ${article} vu sur Marché Louma 🇸🇳. Il est toujours dispo ?`);
 window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank');
}
function filtrer(){
 const q = document.getElementById('search').value.toLowerCase();
 render(produits.filter(p=> (catActive==='Tout'||p.cat===catActive) && p.titre.toLowerCase().includes(q)));
}
function filterCat(c,el){
 catActive=c;
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 filtrer();
}
function vendre(){
 const msg = encodeURIComponent("Salut Marché Louma, je veux vendre un article : ");
 window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank');
}
render(produits);
</script>
</body>
</html>
