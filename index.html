<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché Louma - Comme Vinted 🇸🇳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9}
.header{background:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px} .logo b{color:#0ea5e9} .logo2{color:#f59e0b}
.badge{background:#0ea5e9;color:white;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}
.search{padding:12px} .search input{width:100%;padding:14px;border-radius:14px;border:1px solid #e2e8f0;font-size:16px;background:white}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px 12px}
.cat{background:white;padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;font-weight:600;cursor:pointer;white-space:nowrap}
.cat.active{background:#0f172a;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card img{width:100%;height:160px;object-fit:cover}
.body{padding:10px}
.price{font-weight:900;color:#0ea5e9}
.title{font-size:13px;margin:4px 0;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa{background:#22c55e;color:white;padding:8px;border-radius:10px;text-align:center;margin-top:6px;font-size:13px;font-weight:700;display:block;text-decoration:none}
.fab{position:fixed;bottom:20px;right:20px;background:#0ea5e9;color:white;padding:16px 24px;border-radius:30px;font-weight:900;box-shadow:0 6px 20px rgba(14,165,233,.4);z-index:200;border:none;font-size:16px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:12px}
.box{background:white;width:100%;max-width:450px;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}
.input{width:100%;padding:12px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0;font-size:15px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}
.btn-blue{background:#0ea5e9;color:white} .btn-black{background:#0f172a;color:white}
</style>
</head>
<body>
<div class="header">
<div class="logo"><b>Marché</b> <span class="logo2">Louma</span> 🇸🇳</div>
<div class="badge">V5 SIMPLE</div>
</div>
<div class="search">
<input id="search" placeholder="🔍 Cherche voiture, téléphone..." oninput="render()">
</div>
<div class="cats">
<div class="cat active" onclick="filterCat('tout',this)">Tout</div>
<div class="cat" onclick="filterCat('voiture',this)">🚗 Voitures</div>
<div class="cat" onclick="filterCat('telephone',this)">📱 Téléphones</div>
<div class="cat" onclick="filterCat('mode',this)">👕 Mode</div>
<div class="cat" onclick="filterCat('maison',this)">🏠 Maison</div>
</div>
<div id="grid" class="grid"></div>
<button class="fab" onclick="openModal()">+ Vendre</button>
<div class="modal" id="modal">
<div class="box">
<h2>📦 Vendre sur Louma</h2>
<input id="titre" class="input" placeholder="Ex: iPhone 12 128Go">
<input id="prix" class="input" type="number" placeholder="Prix FCFA ex: 150000">
<select id="cat" class="input">
<option value="telephone">📱 Téléphone</option>
<option value="voiture">🚗 Voiture</option>
<option value="mode">👕 Mode</option>
<option value="maison">🏠 Maison</option>
</select>
<input id="wa" class="input" placeholder="Ton WhatsApp ex: 771234567">
<input id="img" class="input" placeholder="Lien photo (facultatif)">
<textarea id="desc" class="input" placeholder="Description"></textarea>
<button class="btn btn-blue" onclick="publier()">🚀 Publier</button>
<button class="btn btn-black" onclick="closeModal()">Fermer</button>
</div>
</div>
<script>
let cat='tout';
let articles = JSON.parse(localStorage.getItem('louma_articles') || 'null') || [
{titre:'Toyota Corolla 2015 - Bon état',prix:4500000,cat:'voiture',wa:'771234567',img:'https://images.unsplash.com/photo-1550355291-bbee04a92027?w=400'},
{titre:'iPhone 13 128Go Batterie 89%',prix:280000,cat:'telephone',wa:'771234567',img:'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400'},
{titre:'Nike Air Max 43 Neuf',prix:25000,cat:'mode',wa:'771234567',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400'},
{titre:'Canapé 3 places Comme neuf',prix:150000,cat:'maison',wa:'771234567',img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400'}
];
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let grid=document.getElementById('grid'); grid.innerHTML='';
 articles.filter(a=>{
   let okCat = cat==='tout' || a.cat===cat;
   let okSearch = !q || a.titre.toLowerCase().includes(q);
   return okCat && okSearch;
 }).forEach(a=>{
   let d=document.createElement('div'); d.className='card';
   d.innerHTML=`<img src="${a.img||'https://via.placeholder.com/400?text=Louma'}"><div class="body"><div class="price">${Number(a.prix).toLocaleString()} FCFA</div><div class="title">${a.titre}</div><a class="wa" href="https://wa.me/221${a.wa}?text=Salam, je veux ${encodeURIComponent(a.titre)} sur Marché Louma" target="_blank">💬 WhatsApp</a></div>`;
   grid.appendChild(d);
 });
}
function filterCat(c,el){ cat=c; document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render(); }
function openModal(){ document.getElementById('modal').style.display='flex'; }
function closeModal(){ document.getElementById('modal').style.display='none'; }
function publier(){
 let t=document.getElementById('titre').value;
 let p=document.getElementById('prix').value;
 let c=document.getElementById('cat').value;
 let w=document.getElementById('wa').value;
 let im=document.getElementById('img').value || 'https://via.placeholder.com/400?text=Louma';
 if(!t||!p||!w){ alert('Mets titre, prix et WhatsApp'); return; }
 articles.unshift({titre:t,prix:p,cat:c,wa:w,img:im});
 localStorage.setItem('louma_articles', JSON.stringify(articles));
 render(); closeModal();
 alert('✅ Publié ! Tout le monde peut le voir maintenant');
}
render();
</script>
</body>
</html>
