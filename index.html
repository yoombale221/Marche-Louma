<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché Louma 🇸🇳 - Vends & Achète au Sénégal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI}
body{background:#f1f5f9;color:#0f172a}
header{background:linear-gradient(135deg,#0b2e6e 0%,#1e4fb5 100%);color:white;padding:16px 14px;position:sticky;top:0;z-index:20}
.head-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;line-height:1}
.logo span{font-weight:600;font-size:12px;opacity:.9;display:block}
.btn-publier{background:#ff7a00;color:white;border:none;padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(255,122,0,.4)}
.hero{background:white;margin:12px;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.search-box{display:flex;gap:8px;background:#f1f5f9;border-radius:14px;padding:4px 4px 4px 14px;align-items:center}
.search-box input{flex:1;border:none;background:transparent;padding:10px 0;outline:none;font-size:14px;font-weight:600}
.search-box button{background:#0b2e6e;color:white;border:none;padding:10px 16px;border-radius:10px;font-weight:800}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px;scrollbar-width:none}
.chip{flex-shrink:0;border:1.5px solid #e2e8f0;background:white;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.active{background:#0b2e6e;color:white;border-color:#0b2e6e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:.2s;display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.img-wrap{position:relative;height:170px;background:#e2e8f0;overflow:hidden}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:rgba(11,46,110,.9);backdrop-filter:blur(6px);color:white;font-size:10px;padding:5px 9px;border-radius:999px;font-weight:800}
.heart{position:absolute;top:8px;right:8px;background:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.body{padding:10px 10px 12px;flex:1;display:flex;flex-direction:column}
.title{font-size:13px;font-weight:800;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{color:#0b2e6e;font-weight:900;font-size:15px;margin-top:6px}
.meta{font-size:11px;color:#64748b;margin:4px 0 8px;display:flex;justify-content:space-between}
.btn-wa{margin-top:auto;background:#22c55e;color:white;border:none;width:100%;padding:10px;border-radius:12px;font-weight:800;font-size:13px;display:flex;justify-content:center;gap:6px;align-items:center}
.stats{display:flex;justify-content:space-around;background:white;margin:0 12px;padding:12px;border-radius:14px;font-size:12px;color:#64748b;font-weight:700}
.stats b{color:#0b2e6e;font-size:14px;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end}
#modal.show{display:flex}
.modal-box{background:white;width:100%;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box h2{font-size:20px;font-weight:900;margin-bottom:4px}
.modal-box p{font-size:13px;color:#64748b;margin-bottom:16px}
.input{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:12px;outline:none}
.input:focus{border-color:#0b2e6e}
.row{display:flex;gap:10px}
.row .input{flex:1}
.btn-submit{background:#0b2e6e;color:white;border:none;width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:15px;margin-top:4px}
.btn-close{background:#f1f5f9;border:none;padding:12px;width:100%;border-radius:12px;font-weight:700;margin-top:10px}
.preview{width:100%;height:160px;border:2px dashed #cbd5e1;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;background:#f8fafc}
.preview img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b2e6e;color:white;padding:12px 20px;border-radius:999px;font-weight:800;font-size:13px;z-index:100;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
</style>
</head>
<body>
<header>
<div class="head-top">
<div class="logo">Marché Louma 🇸🇳<span>Vends tout • Sénégal</span></div>
<button class="btn-publier" onclick="openModal()">+ Publier</button>
</div>
</header>
<div class="hero">
<div class="search-box">
<span>🔍</span>
<input id="search" placeholder="Rechercher voiture, iPhone, canapé..." oninput="render()">
<button onclick="render()">Chercher</button>
</div>
</div>
<div class="stats">
<div><b id="count">0</b>Annonces</div>
<div><b>78 44 17 720</b>WhatsApp</div>
<div><b>Dakar</b>Guédiawaye</div>
</div>
<div class="filters" id="filters">
<button class="chip active" onclick="setCat('Tout',this)">Tout ✨</button>
<button class="chip" onclick="setCat('Vehicules',this)">🚗 Véhicules</button>
<button class="chip" onclick="setCat('Telephones',this)">📱 Téléphones</button>
<button class="chip" onclick="setCat('Electro',this)">💻 Électro</button>
<button class="chip" onclick="setCat('Maison',this)">🛋️ Maison</button>
<button class="chip" onclick="setCat('Mode',this)">👕 Mode</button>
</div>
<div class="grid" id="grid"></div>
<div id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<h2>Publier un article 📦</h2>
<p>Ton annonce sera visible instantanément par tout le monde !</p>
<div class="preview" id="preview" onclick="document.getElementById('file').click()">📸 Clique pour ajouter une photo</div>
<input type="file" id="file" accept="image/*" hidden onchange="handleFile(this)">
<input class="input" id="titre" placeholder="Titre ex: iPhone 13 Pro 128Go">
<div class="row">
<input class="input" id="prix" placeholder="Prix ex: 280 000 FCFA">
<select class="input" id="cat"><option>Vehicules</option><option>Telephones</option><option>Electro</option><option>Maison</option><option>Mode</option><option>Autre</option></select>
</div>
<div class="row">
<input class="input" id="ville" placeholder="Ville ex: Guédiawaye">
<select class="input" id="etat"><option>Neuf</option><option>Très bon état</option><option>Bon état</option><option>À réparer</option></select>
</div>
<input class="input" id="wa" placeholder="Ton WhatsApp ex: 78 44 17 720">
<textarea class="input" id="desc" rows="3" placeholder="Description rapide..."></textarea>
<button class="btn-submit" onclick="publier()">Publier maintenant 🚀</button>
<button class="btn-close" onclick="closeModal()">Annuler</button>
</div>
</div>
<div class="toast" id="toast">Annonce publiée ! 🎉</div>
<script>
const ADMIN_WA="221784417720";
let catActive="Tout";
let imageBase64="";
let produits = JSON.parse(localStorage.getItem('louma_v2')||'null') || [
{titre:"Toyota Corolla 2015",prix:"3 500 000 FCFA",cat:"Vehicules",ville:"Dakar",etat:"Très bon état",wa:ADMIN_WA,desc:"Très propre",img:"https://images.unsplash.com/photo-1550355291-bbee04a92027?w=600"},
{titre:"iPhone 13 Pro 128Go",prix:"280 000 FCFA",cat:"Telephones",ville:"Dakar",etat:"Très bon état",wa:ADMIN_WA,desc:"Batterie 92%",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600"},
{titre:"Canapé 3 Places",prix:"150 000 FCFA",cat:"Maison",ville:"Guédiawaye",etat:"Bon état",wa:ADMIN_WA,desc:"Velours bleu",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600"},
{titre:"Moto Jakarta 125",prix:"450 000 FCFA",cat:"Vehicules",ville:"Thiès",etat:"Bon état",wa:ADMIN_WA,desc:"Papiers à jour",img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600"},
];
function save(){localStorage.setItem('louma_v2',JSON.stringify(produits));}
function setCat(c,el){catActive=c;document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=produits.filter(p=>(catActive==='Tout'||p.cat===catActive)&& (p.titre+p.ville).toLowerCase().includes(q)).reverse();
 document.getElementById('count').innerText=list.length;
 document.getElementById('grid').innerHTML=list.map((p,i)=>`
  <div class="card">
   <div class="img-wrap"><img src="${p.img}"><span class="badge">${p.etat}</span><span class="heart">❤️</span></div>
   <div class="body">
    <div class="title">${p.titre}</div>
    <div class="price">${p.prix}</div>
    <div class="meta"><span>📍 ${p.ville}</span><span>${p.cat}</span></div>
    <button class="btn-wa" onclick="contacter('${p.titre}', '${p.wa||ADMIN_WA}')">💬 WhatsApp</button>
   </div>
  </div>
 `).join('');
}
function contacter(titre,waNum){
 let clean=waNum.replace(/\s/g,''); if(!clean.startsWith('221'))clean='221'+clean.slice(-9);
 const msg=encodeURIComponent(`Salut, je suis intéressé par ${titre} vu sur Marché Louma 🇸🇳. Toujours dispo ?`);
 window.open(`https://wa.me/${clean}?text=${msg}`,'_blank');
}
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function handleFile(inp){
 const f=inp.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=e=>{
  imageBase64=e.target.result;
  document.getElementById('preview').innerHTML=`<img src="${imageBase64}">`;
 }; r.readAsDataURL(f);
}
function publier(){
 const titre=document.getElementById('titre').value.trim();
 const prix=document.getElementById('prix').value.trim();
 const cat=document.getElementById('cat').value;
 const ville=document.getElementById('ville').value.trim()||"Dakar";
 const etat=document.getElementById('etat').value;
 const wa=document.getElementById('wa').value.trim()||ADMIN_WA;
 const desc=document.getElementById('desc').value.trim();
 if(!titre||!prix){alert("Mets au moins titre et prix !");return;}
 const img=imageBase64||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600";
 produits.push({titre,prix,cat,ville,etat,wa,desc,img});
 save(); render(); closeModal();
 document.getElementById('titre').value="";document.getElementById('prix').value="";document.getElementById('preview').innerHTML="📸 Clique pour ajouter une photo";imageBase64="";
 const t=document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none',2500);
}
render();
</script>
</body>
</html>
