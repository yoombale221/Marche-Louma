<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché Louma PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] pb-24">
<header class="bg-white sticky top-0 z-40 border-b">
<div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<img src="logo.png" class="h-10 w-auto rounded-xl">
</div>
<button onclick="document.getElementById('sellModal').style.display='flex'" class="bg-[#0f172a] text-white px-5 py-2.5 rounded-full font-bold text-sm">+ Vendre</button>
</div>
</header>
<div class="bg-[#0f172a] text-white text-[11px]"><div class="max-w-6xl mx-auto px-4 py-2 flex gap-3"><span>🛡️ Paiement Wave & OM</span><span>•</span><span>📦 Livraison Sénégal</span><span>•</span><span>⭐ Vendeurs Notés</span></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-2xl border p-3 flex gap-2"><input id="q" oninput="render()" placeholder="Voiture, iPhone..." class="flex-1 outline-none"><select id="city" onchange="render()" class="bg-slate-100 rounded-xl px-2 py-1 text-sm font-bold"><option value="">Tout Sénégal</option><option>Dakar</option><option>Touba</option><option>Thiès</option><option>Saint-Louis</option></select></div>
<div class="flex gap-2 mt-3 overflow-x-auto"><button onclick="setCat('tout',this)" class="cat bg-[#0f172a] text-white px-4 py-2 rounded-full text-sm font-bold">Tout</button><button onclick="setCat('voiture',this)" class="cat bg-white border px-4 py-2 rounded-full text-sm font-bold">🚗 Voitures</button><button onclick="setCat('telephone',this)" class="cat bg-white border px-4 py-2 rounded-full text-sm font-bold">📱 Téléphones</button><button onclick="setCat('mode',this)" class="cat bg-white border px-4 py-2 rounded-full text-sm font-bold">👕 Mode</button></div>
<div id="grid" class="grid grid-cols-2 gap-3 mt-4"></div>
</div>
<div id="sellModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-auto"><h2 class="font-black mb-3">Vendre PRO</h2><input type="file" id="photos" accept="image/*" class="w-full border-2 border-dashed rounded-xl p-3 mb-2"><div id="preview" class="flex gap-2 mb-2"></div><input id="titre" placeholder="Titre" class="w-full border rounded-xl p-3 mb-2"><div class="grid grid-cols-2 gap-2 mb-2"><input id="prix" type="number" placeholder="Prix FCFA" class="border rounded-xl p-3"><select id="catInput" class="border rounded-xl p-3"><option value="telephone">Téléphone</option><option value="voiture">Voiture</option><option value="mode">Mode</option><option value="maison">Maison</option></select></div><div class="grid grid-cols-2 gap-2 mb-2"><select id="cityInput" class="border rounded-xl p-3"><option>Dakar</option><option>Touba</option><option>Thiès</option></select><select id="etat" class="border rounded-xl p-3"><option>Neuf</option><option>Très bon état</option></select></div><input id="wa" placeholder="WhatsApp 77XXXXXXX" class="w-full border rounded-xl p-3 mb-2"><button onclick="publishPro()" class="w-full bg-[#0ea5e9] text-white font-black py-4 rounded-xl">🚀 PUBLIER</button><button onclick="document.getElementById('sellModal').style.display='none'" class="w-full mt-2 bg-slate-100 py-2 rounded-xl">Fermer</button></div></div>
<div id="buyModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md p-6"><div id="buyContent"></div></div></div>
<script>
let catFilter='tout';let products=JSON.parse(localStorage.getItem('louma_pro_v6')||'null')||[{titre:'Toyota Corolla 2015',prix:4500000,cat:'voiture',city:'Dakar',etat:'Très bon état',wa:'771234567',img:'https://images.unsplash.com/photo-1550355291-bbee04a92027?w=600',likes:12,verified:true},{titre:'iPhone 13 128Go',prix:280000,cat:'telephone',city:'Dakar',etat:'Très bon état',wa:'771234567',img:'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600',likes:34,verified:true}];
function render(){const q=document.getElementById('q').value.toLowerCase();const city=document.getElementById('city').value;const grid=document.getElementById('grid');grid.innerHTML='';products.filter(p=>(catFilter==='tout'||p.cat===catFilter)&&(!q||p.titre.toLowerCase().includes(q))&&(!city||p.city===city)).forEach((p,i)=>{const d=document.createElement('div');d.className='bg-white rounded-2xl overflow-hidden border';d.innerHTML=`<div class="relative"><img src="${p.img}" class="w-full h-48 object-cover"><div class="absolute top-2 left-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded-full">${p.city}</div></div><div class="p-3"><div class="font-black text-[#0ea5e9]">${Number(p.prix).toLocaleString()} FCFA</div><div class="text-[13px] font-bold">${p.titre}</div><div class="text-[11px] text-slate-400">${p.etat}</div><button onclick="buy(${i})" class="w-full mt-3 bg-[#0f172a] text-white py-2.5 rounded-xl font-bold text-sm">Acheter 🛡️</button></div>`;grid.appendChild(d);});}
function setCat(c,el){catFilter=c;document.querySelectorAll('.cat').forEach(b=>b.className='cat bg-white border px-4 py-2 rounded-full text-sm font-bold');el.className='cat bg-[#0f172a] text-white px-4 py-2 rounded-full text-sm font-bold';render();}
function buy(i){const p=products[i];document.getElementById('buyContent').innerHTML=`<img src="${p.img}" class="w-full h-56 object-cover rounded-xl mb-3"><div class="font-black text-xl text-[#0ea5e9]">${Number(p.prix).toLocaleString()} FCFA</div><div class="font-bold">${p.titre}</div><div class="bg-slate-50 rounded-xl p-3 mt-3 text-sm"><b>🛡️ Paiement sécurisé Wave/OM:</b><br>1. WhatsApp vendeur<br>2. Paye Wave<br>3. Envoie capture</div><a href="https://wa.me/221${p.wa}?text=Je veux ${encodeURIComponent(p.titre)}" target="_blank" class="block w-full mt-4 bg-[#22c55e] text-white text-center py-4 rounded-xl font-black">💬 WhatsApp</a><button onclick="document.getElementById('buyModal').style.display='none'" class="w-full mt-2 bg-slate-100 py-2 rounded-xl">Fermer</button>`;document.getElementById('buyModal').style.display='flex';}
document.getElementById('photos')?.addEventListener('change',function(e){const pre=document.getElementById('preview');pre.innerHTML='';Array.from(e.target.files).slice(0,3).forEach(f=>{const r=new FileReader();r.onload=ev=>{pre.innerHTML+=`<img src="${ev.target.result}" class="w-16 h-16 rounded-lg object-cover border">`;};r.readAsDataURL(f);});});
function publishPro(){const t=document.getElementById('titre').value;const pr=document.getElementById('prix').value;const cat=document.getElementById('catInput').value;const city=document.getElementById('cityInput').value;const etat=document.getElementById('etat').value;const wa=document.getElementById('wa').value;const files=document.getElementById('photos').files;if(!t||!pr||!wa){alert('Remplis tout');return;}let img='https://via.placeholder.com/600';if(files[0]){const r=new FileReader();r.onload=ev=>{save(ev.target.result);};r.readAsDataURL(files[0]);}else save(img);function save(im){products.unshift({titre:t,prix:pr,cat,city,etat,wa,img:im,likes:0,verified:false});localStorage.setItem('louma_pro_v6',JSON.stringify(products));render();document.getElementById('sellModal').style.display='none';alert('✅ Publié PRO avec logo !');}}
render();
</script>
</body>
</html>
