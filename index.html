<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché Louma - Wave</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f8fafc] pb-24">
<header class="bg-white sticky top-0 z-40 border-b"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="h-10 w-10 bg-[#1e40af] rounded-xl flex items-center justify-center font-black text-white">L</div><div><div class="font-black">Marché <span class="text-[#f59e0b]">Louma</span></div><div class="text-[9px] font-bold text-slate-500">MARCHÉ LOUMA • WAVE AUTO</div></div></div>
<button onclick="document.getElementById('sellModal').style.display='flex'" class="bg-black text-white px-5 py-2.5 rounded-full font-bold text-sm">+ Vendre</button></div></header>

<div class="max-w-6xl mx-auto p-4">
<input id="q" oninput="render()" placeholder="Chercher..." class="w-full bg-white border rounded-2xl p-4 mb-4 outline-none">
<div id="grid" class="grid grid-cols-2 gap-3"></div>

<div class="mt-8 bg-white border-2 border-[#1e40af] rounded-2xl p-5 text-center">
<div class="font-black">💰 Payer Marché Louma avec Wave</div>
<a href="https://pay.wave.com/m/M_sn_8OU8BaMJ3lgb/c/sn/" target="_blank" class="inline-block mt-3 bg-[#1e40af] text-white px-6 py-3 rounded-xl font-black">🔵 PAYER MARCHÉ LOUMA</a>
<div class="text-[10px] text-slate-400 mt-2">784417720 - Moussa Laye Gadiaga</div>
</div>
</div>

<div id="buyModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md"><div id="buyContent" class="p-5"></div></div></div>

<script>
const WAVE_LINK = "https://pay.wave.com/m/M_sn_8OU8BaMJ3lgb/c/sn/";
const NOM = "Marché Louma";
const NUM = "784417720";
let products=[
{titre:'Parfum 15ml',prix:2000,img:'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600'},
{titre:'CANON 5D IV',prix:300000,img:'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=600'},
{titre:'Pules coton',prix:15000,img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600'},
{titre:'Voiture Rouge',prix:4500000,img:'https://images.unsplash.com/photo-1550355291-bbee04a92027?w=600'}
];
let cur=null;
function render(){
let q=document.getElementById('q').value.toLowerCase();
let g=document.getElementById('grid');
g.innerHTML='';
products.forEach((p,i)=>{
if(q && !p.titre.toLowerCase().includes(q)) return;
g.innerHTML+=`<div class="bg-white rounded-2xl border overflow-hidden"><img src="${p.img}" class="w-full h-44 object-cover"><div class="p-3"><div class="font-black text-[#0ea5e9]">${p.prix.toLocaleString()} FCFA</div><div class="text-[13px] font-bold">${p.titre}</div><button onclick="openPay(${i})" class="w-full mt-3 bg-[#1e40af] text-white py-3 rounded-xl font-black text-sm">🔵 Payer avec Wave</button><a href="https://wa.me/221${NUM}" target="_blank" class="block text-center mt-2 bg-[#22c55e] text-white py-2.5 rounded-xl font-bold text-sm">WhatsApp</a></div></div>`;
});
}
function openPay(i){
cur=products[i];
let waveAuto=`${WAVE_LINK}?amount=${cur.prix}`;
document.getElementById('buyContent').innerHTML=`<h2 class="font-black mb-3">Payer ${NOM}</h2><img src="${cur.img}" class="w-full h-40 object-cover rounded-xl mb-3"><div class="bg-blue-50 p-3 rounded-xl text-center mb-3"><div class="font-black text-xl text-[#1e40af]">${cur.prix.toLocaleString()} FCFA</div><div class="text-xs">${cur.titre}</div></div><a href="${waveAuto}" target="_blank" class="block w-full bg-[#1e40af] text-white text-center font-black py-4 rounded-xl">🔵 PAYER AVEC WAVE</a><div class="text-[11px] text-center mt-2">Lien: ${WAVE_LINK}<br>Montant auto, tape juste ton PIN</div><button onclick="document.getElementById('buyModal').style.display='none'" class="w-full mt-3 bg-slate-200 py-2 rounded-xl">Fermer</button>`;
document.getElementById('buyModal').style.display='flex';
}
render();
</script>
</body></html>
