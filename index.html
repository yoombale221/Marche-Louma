<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Marché Louma - Wave</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f8fafc] pb-24">
<header class="bg-white sticky top-0 z-40 border-b"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-2"><div class="h-10 w-10 bg-[#1e40af] rounded-xl flex items-center justify-center font-black text-white">L</div><div><div class="font-black">Marché <span class="text-[#f59e0b]">Louma</span></div><div class="text-[9px] font-bold text-slate-500">MARCHÉ LOUMA • WAVE AUTO • 784417720</div></div></div><button onclick="document.getElementById('sellModal').style.display='flex'" class="bg-black text-white px-5 py-2.5 rounded-full font-bold text-sm">+ Vendre</button></div></header>
<div class="max-w-6xl mx-auto p-4"><input id="q" oninput="render()" placeholder="Chercher voiture, iPhone, pule..." class="w-full bg-white border rounded-2xl p-4 mb-4 outline-none"><div id="grid" class="grid grid-cols-2 gap-3"></div></div>

<!-- MODAL VENDRE - CORRIGÉ -->
<div id="sellModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md p-5"><div class="flex justify-between mb-3"><h2 class="font-black text-lg">Vendre sur Marché Louma</h2><button onclick="document.getElementById('sellModal').style.display='none'" class="w-8 h-8 bg-slate-100 rounded-full">✕</button></div>
<input type="file" id="photos" class="w-full border-2 border-dashed rounded-xl p-3 mb-2 text-sm">
<input id="titre" placeholder="Titre de ton article *" class="w-full border rounded-xl p-3 mb-2 text-sm">
<input id="prix" type="text" inputmode="numeric" placeholder="Prix FCFA *" class="w-full border rounded-xl p-3 mb-2 text-sm">
<input id="wa" placeholder="Ton numéro Wave (ex: 784417720)" class="w-full border rounded-xl p-3 mb-3 text-sm">
<button onclick="publishPro()" class="w-full bg-[#1e40af] text-white font-black py-4 rounded-xl">✅ PUBLIER MAINTENANT</button>
<div id="err" class="hidden mt-2 bg-red-100 text-red-600 p-2 rounded text-xs font-bold"></div>
</div></div>

<div id="buyModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md"><div id="buyContent" class="p-5"></div></div></div>

<script>
const WAVE_LINK = "https://pay.wave.com/m/M_sn_8OU8BaMJ3lgb/c/sn/";
const NUM = "784417720";
let base=[{titre:'Parfum 15ml',prix:2000,img:'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600'},{titre:'CANON 5D IV',prix:300000,img:'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=600'},{titre:'Pules coton',prix:15000,img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600'},{titre:'Voiture Rouge',prix:4500000,img:'https://images.unsplash.com/photo-1550355291-bbee04a92027?w=600'}];
let mine=JSON.parse(localStorage.getItem('louma_v15')||'[]');
let products=[...mine,...base];
let cur=null;
function render(){let q=document.getElementById('q').value.toLowerCase();let g=document.getElementById('grid');g.innerHTML='';products.forEach((p,i)=>{if(q&&!p.titre.toLowerCase().includes(q))return;g.innerHTML+=`<div class="bg-white rounded-2xl border overflow-hidden"><img src="${p.img}" class="w-full h-44 object-cover"><div class="p-3"><div class="font-black text-[#0ea5e9]">${Number(p.prix).toLocaleString()} FCFA</div><div class="text-[13px] font-bold h-10">${p.titre}</div><button onclick="openPay(${i})" class="w-full mt-3 bg-[#1e40af] text-white py-3 rounded-xl font-black text-sm">🔵 Payer avec Wave</button><a href="https://wa.me/221${NUM}" target="_blank" class="block text-center mt-2 bg-[#22c55e] text-white py-2.5 rounded-xl font-bold text-sm">WhatsApp</a></div></div>`;});}
function openPay(i){cur=products[i];let waveAuto=`${WAVE_LINK}?amount=${cur.prix}`;document.getElementById('buyContent').innerHTML=`<div class="flex justify-between mb-2"><h2 class="font-black">Payer Marché Louma</h2><button onclick="document.getElementById('buyModal').style.display='none'" class="w-8 h-8 bg-slate-100 rounded-full">✕</button></div><img src="${cur.img}" class="w-full h-40 object-cover rounded-xl mb-3"><div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-center mb-3"><div class="font-black text-xl text-[#1e40af]">${Number(cur.prix).toLocaleString()} FCFA</div><div class="text-xs">${cur.titre}</div></div><a href="${waveAuto}" target="_blank" class="block w-full bg-[#1e40af] text-white text-center font-black py-4 rounded-xl">🔵 PAYER AVEC WAVE</a><div class="text-[10px] text-center mt-2 text-slate-500">${WAVE_LINK}<br>Montant pré-rempli, tape ton PIN</div>`;document.getElementById('buyModal').style.display='flex';}
function publishPro(){
let t=document.getElementById('titre').value.trim();
let pr=document.getElementById('prix').value.replace(/[^0-9]/g,'');
let wa=document.getElementById('wa').value.replace(/[^0-9]/g,'')||NUM;
let err=document.getElementById('err');
if(!t||!pr){err.innerText='⚠️ Mets Titre + Prix';err.classList.remove('hidden');return;}
err.classList.add('hidden');
let item={titre:t,prix:pr,img:'https://via.placeholder.com/600?text='+encodeURIComponent(t)};
let f=document.getElementById('photos').files[0];
function save(it){let all=JSON.parse(localStorage.getItem('louma_v15')||'[]');all.unshift(it);localStorage.setItem('louma_v15',JSON.stringify(all));products=[...all,...base];render();document.getElementById('sellModal').style.display='none';alert('✅ Publié sur Marché Louma !');}
if(f){let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=500;c.height=500;c.getContext('2d').drawImage(img,0,0,500,500);item.img=c.toDataURL('image/jpeg',0.6);save(item);};img.src=e.target.result;};r.readAsDataURL(f);}else save(item);
}
render();
</script>
</body></html>
