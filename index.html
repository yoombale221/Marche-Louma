<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché Louma - Guédiawaye</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] pb-24">
<header class="bg-white sticky top-0 z-40 border-b">
<div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="h-10 w-10 bg-[#1e40af] rounded-xl flex items-center justify-center font-black text-white">M</div>
<div><div class="font-black text-[15px]">Marché <span class="text-[#f59e0b]">Louma</span></div><div class="text-[9px] tracking-widest text-slate-400 font-bold">MARCHÉ LOUMA • SÉCURISÉ • WAVE DIRECT</div></div>
</div>
<button onclick="document.getElementById('sellModal').style.display='flex'" class="bg-[#0f172a] text-white px-6 py-3 rounded-full font-black text-sm">+ Vendre</button>
</div>
</header>
<div class="bg-[#0f172a] text-white text-[11px]">
<div class="max-w-6xl mx-auto px-4 py-2.5 flex justify-between">
<span id="count">Chargement...</span>
<span>🛡️ Wave Sécurisé</span>
<span>📍 Guédiawaye</span>
</div>
</div>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-2xl border p-3 flex gap-2">
<input id="q" oninput="window.render()" placeholder="Chercher..." class="flex-1 outline-none text-sm px-2">
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-4"></div>
</div>

<div id="sellModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
<div class="bg-white rounded-2xl w-full max-w-md p-5">
<div class="flex justify-between mb-4"><h2 class="font-black text-lg">Vendre</h2><button onclick="document.getElementById('sellModal').style.display='none'" class="w-8 h-8 bg-slate-100 rounded-full">✕</button></div>
<input type="file" id="photos" accept="image/*" class="w-full border-2 border-dashed rounded-xl p-3 mb-3 text-sm">
<input id="titre" placeholder="Titre ex: Chargeur iPhone" class="w-full border rounded-xl p-3 mb-3 text-sm">
<input id="prix" type="text" inputmode="numeric" placeholder="Prix ex: 1000" class="w-full border rounded-xl p-3 mb-3 text-sm">
<input id="nomVendeur" placeholder="Nom boutique" class="w-full border rounded-xl p-3 mb-3 text-sm">
<input id="telVendeur" placeholder="WhatsApp 784417720" class="w-full border rounded-xl p-3 mb-3 text-sm">
<input id="waveVendeur" value="https://pay.wave.com/m/M_sn_8OU8BaMJ3lgb/c/sn/" class="w-full border-2 border-blue-400 rounded-xl p-3 mb-3 text-sm bg-blue-50">
<div id="err" class="hidden bg-red-100 text-red-700 p-3 rounded-xl text-xs font-bold mb-3"></div>
<button onclick="window.publishPro()" id="btnPub" class="w-full bg-[#0f6aaf] text-white font-black py-4 rounded-xl">PUBLIER 🚀</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAau29FrKaPSdx8KxGuiKxvLFPfRe1P-U",
  authDomain: "marche-louma-27615.firebaseapp.com",
  projectId: "marche-louma-27615",
  storageBucket: "marche-louma-27615.firebasestorage.app",
  messagingSenderId: "841591550315",
  appId: "1:841591550315:web:c315ca9af9d8c8be9c2e"
};

const DEFAULT_WAVE = "https://pay.wave.com/m/M_sn_8OU8BaMJ3lgb/c/sn/";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "produits");
const qy = query(colRef, orderBy("createdAt","desc"));
let products = [];

onSnapshot(qy, (snap)=>{
  products = [];
  snap.forEach(d=>products.push({id:d.id, ...d.data()}));
  document.getElementById('count').innerText = products.length + " produits en ligne";
  window.render();
});

window.render = function(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('q').value.toLowerCase().trim();
  grid.innerHTML = "";
  if(products.length===0){ grid.innerHTML = '<div class="col-span-3 text-center py-20 text-slate-400">Aucun produit</div>'; return; }
  products.forEach((p, i)=>{
    if(q && !(p.titre+"").toLowerCase().includes(q)) return;
    let prixNum = parseInt(String(p.prix||"0").replace(/[^0-9]/g,"")) || 1000;
    let img = p.img || "https://via.placeholder.com/400?text=Produit";
    let tel = String(p.telVendeur||"784417720").replace(/[^0-9]/g,"");
    let waveBase = String(p.waveVendeur||DEFAULT_WAVE).trim();
    if(!waveBase.includes("wave.com")) waveBase = DEFAULT_WAVE;
    let finalLink = waveBase + (waveBase.includes("?") ? "&" : "?") + "amount=" + prixNum;
    grid.innerHTML += '<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><img src="'+img+'" class="w-full h-44 object-cover"><div class="p-3"><div class="font-black text-[#0ea5e9] text-[16px]">'+prixNum.toLocaleString()+' FCFA</div><div class="text-[13px] font-bold leading-tight h-10 mt-1">'+(p.titre||"Produit")+'</div><div class="text-[11px] text-slate-500 mt-1">'+(p.nomVendeur||"Marche Louma")+'</div><a href="'+finalLink+'" class="block text-center w-full mt-3 bg-[#0f172a] text-white py-3 rounded-xl font-black text-[13px]">Payer Marché Louma 🔵</a><a href="https://wa.me/221'+tel+'" target="_blank" class="block text-center mt-2 bg-[#22c55e] text-white py-2.5 rounded-xl font-bold text-[13px]">💬 WhatsApp</a></div></div>';
  });
};

window.publishPro = async function(){
  const t = document.getElementById('titre').value.trim();
  const prRaw = document.getElementById('prix').value.trim();
  const nom = document.getElementById('nomVendeur').value.trim();
  const tel = document.getElementById('telVendeur').value.replace(/[^0-9]/g,"").trim();
  let wave = document.getElementById('waveVendeur').value.trim();
  const err = document.getElementById('err');
  const btn = document.getElementById('btnPub');
  if(!wave.includes("wave.com")) wave = DEFAULT_WAVE;
  let prix = prRaw.replace(/[^0-9]/g,"");
  if(!t || !prix || !nom || !tel){ err.innerText = "Remplis tout"; err.classList.remove("hidden"); return; }
  err.classList.add("hidden"); btn.innerText = "Publication..."; btn.disabled = true;
  let imgUrl = "https://via.placeholder.com/600?text="+encodeURIComponent(t);
  const file = document.getElementById('photos').files[0];
  const doSave = async (finalImg)=>{
    try{
      await addDoc(colRef, { titre:t, prix:prix, nomVendeur:nom, telVendeur:tel, waveVendeur:wave, img:finalImg, city:"Dakar", createdAt:Date.now() });
      document.getElementById('sellModal').style.display="none";
      document.getElementById('titre').value=""; document.getElementById('prix').value="";
      alert("✅ Publié !");
    }catch(e){ err.innerText="Erreur: "+e.message; err.classList.remove("hidden"); }
    btn.innerText="PUBLIER 🚀"; btn.disabled=false;
  };
  if(file){ const r = new FileReader(); r.onload = async (e)=>{ await doSave(e.target.result); }; r.readAsDataURL(file); } else { await doSave(imgUrl); }
};
</script>
</body>
</html>
